<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Road Connectivity | SurakshaNER</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
  * {
    box-sizing: border-box;
  }

  :root {
    --bg: #061b10;
    --header-bg: #07130d;
    --panel: #172d23;
    --panel-inner: #123e2f;
    --border: #315446;
    --text: #f5f7f6;
    --muted: #8eaaa0;
    --green: #2ecc71;
    --orange: #f39c12;
    --red: #e74c3c;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }

  header {
    min-height: 76px;
    padding: 12px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    background: var(--header-bg);
    border-bottom: 1px solid #1b3027;
  }

  .brand h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .brand p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .header-nav {
    display: flex;
    align-items: center;
    gap: 26px;
    font-size: 16px;
  }

  .header-nav a {
    color: var(--text);
    text-decoration: none;
  }

  .header-nav a:hover {
    color: var(--green);
  }

  .page-wrapper {
    padding: 26px 33px 40px;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 48px;
    color: var(--text);
    font-size: 21px;
    text-decoration: none;
  }

  .back-link:hover {
    color: var(--green);
  }

  .page-title {
    margin: 0 0 36px;
    font-size: 30px;
    font-weight: 700;
  }

  .page-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 20px;
    align-items: start;
  }

  .panel {
    padding: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  .panel h2 {
    margin: 0 0 20px;
    font-size: 21px;
    font-weight: 700;
  }

  #road-map {
    width: 100%;
    height: 590px;
    overflow: hidden;
    border: 1px solid #315446;
    border-radius: 12px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 18px;
    color: #d5e2dc;
    font-size: 14px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .legend-color {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  #road-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .road-card {
    padding: 17px;
    background: var(--panel-inner);
    border: 1px solid #2b5b49;
    border-radius: 12px;
  }

  .road-name {
    margin-bottom: 12px;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
  }

  .road-status {
    margin-bottom: 13px;
    color: #b5cbc1;
    font-size: 14px;
  }

  .road-status strong {
    color: var(--text);
    text-transform: capitalize;
  }

  .status-select {
    width: 100%;
    padding: 11px 12px;
    color: var(--text);
    background: #0b281c;
    border: 1px solid #426b59;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }

  .status-select:focus {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }

  .status-select option {
    color: #111;
    background: white;
  }

  .empty-message {
    padding: 22px;
    color: var(--muted);
    background: var(--panel-inner);
    border: 1px solid #2b5b49;
    border-radius: 12px;
  }

  /* Leaflet controls in dark mode */
  .leaflet-control-zoom a,
  .leaflet-control-layers {
    color: #eaf4ef !important;
    background: #102b20 !important;
    border-color: #426b59 !important;
  }

  .leaflet-control-zoom a:hover {
    background: #1b4735 !important;
  }

  .leaflet-popup-content-wrapper,
  .leaflet-popup-tip {
    background: #102b20;
    color: white;
  }

  .leaflet-popup-content {
    line-height: 1.6;
  }

  @media (max-width: 1000px) {
    header {
      align-items: flex-start;
      flex-direction: column;
    }

    .header-nav {
      flex-wrap: wrap;
      gap: 15px;
    }

    .page-layout {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 600px) {
    .page-wrapper {
      padding: 22px 16px 30px;
    }

    header {
      padding: 14px 18px;
    }

    .back-link {
      margin-bottom: 32px;
      font-size: 18px;
    }

    .page-title {
      font-size: 25px;
    }

    .panel {
      padding: 16px;
    }

    #road-map {
      height: 420px;
    }
  }
</style>
</head>

<body>
  <header>
    <div class="brand">
      <h1>SurakshaNER</h1>
      <p>भूस्खलन पूर्व चेतावनी प्रणाली · Disaster Management, NER</p>
    </div>

    <nav class="header-nav">
      <a href="/">Home</a>
      <a href="/citizen/">Citizen Portal</a>
      <a href="/rescue/">Rescue &amp; Authority</a>
    </nav>
  </header>

  <main class="page-wrapper">
    <a class="back-link" href="/rescue/">
      ← Back to Dashboard
    </a>

    <h1 class="page-title">Road Connectivity Monitoring</h1>

    <div class="page-layout">
      <section class="panel">
        <h2>Road Network Map</h2>

        <div id="road-map"></div>

        <div class="legend">
          <div class="legend-item">
            <span
              class="legend-color"
              style="background: #2ecc71;"
            ></span>
            Clear
          </div>

          <div class="legend-item">
            <span
              class="legend-color"
              style="background: #f39c12;"
            ></span>
            At Risk
          </div>

          <div class="legend-item">
            <span
              class="legend-color"
              style="background: #e74c3c;"
            ></span>
            Blocked
          </div>
        </div>
      </section>

      <aside class="panel">
        <h2>Road Status</h2>

        <div id="road-list">
          <p class="empty-message">Loading roads...</p>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/rescue/road-connectivity.js"></script>
</body>
</html>
